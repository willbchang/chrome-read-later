<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Read Later Options</title>
    <link href="options.css" rel="stylesheet">
    <script crossorigin="anonymous" src="../modules/libraries/jquery.min.js"></script>
    <script src="options.js" type="module"></script>
</head>
<body>

<b id="features">Options</b>
<div class="inputs">
    <input id="itemNewTab" name="itemNewTab" type="checkbox">
    <label for="itemNewTab">Open reading list item in <b>new tab</b> by default.
        <small>Swap default open and <kbd>Alt</kbd> + open.</small>
    </label>
</div>

<div class="inputs">
    <input id="keepSavedTab" name="keepSavedTab" type="checkbox">
    <label for="keepSavedTab">Do not close tab when saving it.
        <small>A "done" text will temporarily show in the bottom of the icon.</small>
    </label>
</div>

<div class="inputs">
    <input id="itemPopover" name="itemPopover" type="checkbox">
    <label for="itemPopover">Show item details on hover.
        <small>Displays the page title and URL in a popover.</small>
    </label>
</div>

<div class="inputs">
    <input id="historyMode" name="historyMode" type="checkbox">
    <label for="historyMode">Keep reading list history.
        <small>Keeps saved items locally for the History view.</small>
    </label>
</div>

<div class="inputs history-retention">
    <label for="historyRetentionDays">Delete history older than
        <small>At most 5,000 recent items are kept.</small>
    </label>
    <select id="historyRetentionDays" name="historyRetentionDays">
        <option value="0">Never</option>
        <option value="7">1 week</option>
        <option value="30">1 month</option>
        <option value="90">3 months</option>
        <option value="180">6 months</option>
        <option value="365">1 year</option>
    </select>
</div>

<div class="inputs">
    <input id="hybrid" name="hybrid" type="checkbox">
    <label for="hybrid">Store overflow items locally.
        <small>Chrome Sync keeps syncing until it is full; additional items stay on this computer.</small>
        <small id="storageStatus" role="status"></small>
    </label>
</div>
</body>
</html>
